name: drss
description: Digital Registration and Selection System (DRSS) - A Flutter application for transparent digital registration and random lottery selection.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # State Management
  provider: ^6.1.5

  # Routing
  go_router: ^16.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # UI
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.3.1

  # Storage
  shared_preferences: ^2.5.3

  # File Picker
  file_picker: ^10.3.2

  # CSV Export
  csv: ^6.0.0

  # PDF Export
  pdf: ^3.11.3
  printing: ^5.14.2

  # Random Selection
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
